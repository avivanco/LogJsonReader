spring.application.name=logviewer

# Local by default; the Docker image overrides this with SERVER_ADDRESS=0.0.0.0
server.address=127.0.0.1
server.port=8080
server.compression.enabled=true

spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=1MB

management.endpoints.web.exposure.include=health

logviewer.data-dir=${java.io.tmpdir}/logviewer
# Directories from which the server may load files (empty = disabled). Example: --logviewer.allowed-dirs=/logs
logviewer.allowed-dirs=
logviewer.session-ttl=12h
logviewer.batch-size=10000
logviewer.max-line-length=262144
logviewer.sample-size=50
logviewer.duckdb-memory-limit=1GB
